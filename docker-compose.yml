services:
  m20-character-generator:
    build: .
    image: m20-character-generator:latest
    container_name: m20-character-generator
    ports:
      - "8009:8009"
    volumes:
      - ./data:/data
      - ./app/public:/app/public:ro
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=8009
      - DATA_DIR=/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8009/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
